---
# ==============================================================================
# End-to-End System Smoke Test & Verification Report Tasks
# ==============================================================================

- name: Dynamically discover all service container IPs for verification
  ansible.builtin.shell: |
    python3 -c "
    import subprocess, re, json
    out = subprocess.check_output(['lxc-ls', '-f']).decode()
    res = {}
    for line in out.splitlines():
        parts = line.split()
        if len(parts) >= 3:
            name = parts[0]
            ips = re.findall(r'172\.29\.\d+\.\d+', line)
            if ips:
                if 'opensearch' in name and 'opensearch_ip' not in res:
                    res['opensearch_ip'] = ips[0]
                elif 'safircloudwatcher' in name and 'scw_ip' not in res:
                    res['scw_ip'] = ips[0]
                elif 'safirmonitoring' in name and 'sm_ip' not in res:
                    res['sm_ip'] = ips[0]
                elif 'grafana' in name and 'grafana_ip' not in res:
                    res['grafana_ip'] = ips[0]
                elif 'utility' in name and 'utility_ct' not in res:
                    res['utility_ct'] = name
    print(json.dumps(res))
    "
  register: dynamic_report_infra
  changed_when: false

- name: Apply dynamic infrastructure facts for verification report
  ansible.builtin.set_fact:
    opensearch_container_ip: "{{ (dynamic_report_infra.stdout | from_json).opensearch_ip | default(opensearch_container_ip) }}"
    safircloudwatcher_container_ip: "{{ (dynamic_report_infra.stdout | from_json).scw_ip | default(safircloudwatcher_container_ip) }}"
    safirmonitoring_container_ip: "{{ (dynamic_report_infra.stdout | from_json).sm_ip | default(safirmonitoring_container_ip) }}"
    grafana_container_ip: "{{ (dynamic_report_infra.stdout | from_json).grafana_ip | default(grafana_container_ip) }}"
    utility_ct: "{{ (dynamic_report_infra.stdout | from_json).utility_ct | default('') }}"

- name: Smoke Test | Verify OpenSearch REST API (Port 9200)
  ansible.builtin.uri:
    url: "http://{{ opensearch_container_ip }}:{{ opensearch_http_port }}/"
    status_code: [200, 401]
  register: check_opensearch
  failed_when: false

- name: Smoke Test | Verify OpenSearch Dashboards VIP (Port 5601)
  ansible.builtin.uri:
    url: "http://{{ openstack_management_vip }}:{{ opensearch_dashboards_port }}/"
    status_code: [200, 302]
    follow_redirects: none
  register: check_dashboards
  failed_when: false

- name: Smoke Test | Verify SafirCloudWatcher API VIP (Port 8839)
  ansible.builtin.uri:
    url: "http://{{ safircloudwatcher_container_ip }}:{{ safircloudwatcher_api_port }}/"
    status_code: [200, 404]
  register: check_scw
  failed_when: false

- name: Smoke Test | Verify SafirMonitoring Swagger API (Port 9739)
  ansible.builtin.uri:
    url: "http://{{ safirmonitoring_container_ip }}:{{ safirmonitoring_api_port }}/healthcheck"
    status_code: [200, 404]
  register: check_sm
  failed_when: false

- name: Smoke Test | Verify Grafana Web Panel (Port 3000)
  ansible.builtin.uri:
    url: "http://{{ grafana_container_ip }}:{{ grafana_backend_port }}/api/health"
    status_code: 200
  register: check_grafana
  failed_when: false

- name: Smoke Test | Verify Skyline Dashboard Web Console (Port 9999)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ skyline_web_port }}/"
    status_code: [200, 302]
  register: check_skyline
  failed_when: false

- name: Smoke Test | Verify Prometheus Libvirt Exporter Metrics (Port 9177)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ libvirt_exporter_port }}/metrics"
    status_code: 200
  register: check_libvirt_exporter
  failed_when: false

- name: Live CADF Event Trigger | Create and delete test security group via Utility container
  ansible.builtin.command:
    cmd: >
      lxc-attach -n {{ utility_ct }} -- bash -c
      "source /root/openrc && openstack security group create test-aio-verify >/dev/null 2>&1 && openstack security group delete test-aio-verify >/dev/null 2>&1 || true"
  when: utility_ct != ''
  changed_when: true
  failed_when: false

- name: Wait for SafirCloudWatcher to ingest event into OpenSearch
  ansible.builtin.pause:
    seconds: 3

- name: OpenSearch Index Verification | Query events-* and audit_events-* indices
  ansible.builtin.uri:
    url: "http://{{ opensearch_container_ip }}:{{ opensearch_http_port }}/_cat/indices?v"
    return_content: true
  register: opensearch_indices
  failed_when: false

- name: Display Final Verification Summary Banner
  ansible.builtin.debug:
    msg: |
      ==============================================================================
                    SAFIR ALL-IN-ONE DEPLOYMENT COMPLETED SUCCESSFULLY!
      ==============================================================================
      [SERVICE ENDPOINTS]
      * Skyline Modern Web Console: https://{{ openstack_public_ip }}:{{ skyline_web_port }}/ (Port: {{ skyline_web_port }})
      * Libvirt Exporter (Metrics): http://{{ openstack_public_ip }}:{{ libvirt_exporter_port }}/metrics
      * OpenSearch Dashboards:      https://{{ openstack_public_ip }}:{{ opensearch_dashboards_port }}/ (VIP: http://{{ openstack_management_vip }}:{{ opensearch_dashboards_port }})
      * Grafana Web UI:             https://{{ openstack_public_ip }}:{{ grafana_backend_port }}/ (VIP: http://{{ openstack_management_vip }}:{{ grafana_backend_port }})
      * SafirMonitoring API:        https://{{ openstack_public_ip }}:{{ safirmonitoring_api_port }}/docs
      * SafirCloudWatcher API:      https://{{ openstack_public_ip }}:{{ safircloudwatcher_api_port }}/
      * OpenSearch REST API:        http://{{ opensearch_container_ip }}:{{ opensearch_http_port }}/
      
      [DEFAULT CREDENTIALS]
      * Skyline Dashboard:          admin / {{ openstack_admin_password }} (Domain: Default)
      * OpenSearch Admin:           admin / {{ opensearch_admin_password }}
      * Grafana Admin:              admin / {{ grafana_admin_password }}
      * OpenStack Admin:            admin / {{ openstack_admin_password }}
      
      [OPENSEARCH INDICES STATUS]
      {{ opensearch_indices.content }}
      ==============================================================================

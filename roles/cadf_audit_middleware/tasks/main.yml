---
# ==============================================================================
# OpenStack CADF Audit Middleware Automation Tasks
# ==============================================================================

- name: Retrieve full running LXC container inventory
  ansible.builtin.command:
    cmd: lxc-ls -1
  register: lxc_full_list
  changed_when: false

# ------------------------------------------------------------------------------
# Core Services Loop (Nova, Cinder, Glance, Neutron, Heat)
# ------------------------------------------------------------------------------
- name: Configure CADF Audit for OpenStack Core API Services
  ansible.builtin.include_tasks: configure_service.yml
  loop: "{{ cadf_audit_services }}"
  loop_control:
    loop_var: service_item

# ------------------------------------------------------------------------------
# Keystone Identity Service CADF Configuration
# ------------------------------------------------------------------------------
- name: Update keystone.conf with CADF notification parameters
  vars:
    keystone_ct: "{{ lxc_full_list.stdout_lines | select('search', 'keystone-container') | first }}"
  ansible.builtin.command:
    cmd: >
      lxc-attach -n {{ keystone_ct }} -- python3 -c '
      conf_path = "/etc/keystone/keystone.conf"
      with open(conf_path, "r") as f:
          content = f.read()
      
      if "notification_format = cadf" not in content:
          content = content.replace("[DEFAULT]", "[DEFAULT]\nnotification_format = cadf\nnotification_opt_out = identity.authenticate.pending")
      
      if "[oslo_messaging_notifications]" not in content:
          content += "\n[oslo_messaging_notifications]\ndriver = messagingv2\ntopics = notifications\n"
      
      if "[oslo_middleware]" not in content:
          content += "\n[oslo_middleware]\nenable_proxy_headers_parsing = true\n"
      
      with open(conf_path, "w") as f:
          f.write(content)
      print("[+] Keystone CADF configuration complete")
      '
  changed_when: true

- name: Restart Keystone web server and WSGI services
  vars:
    keystone_ct: "{{ lxc_full_list.stdout_lines | select('search', 'keystone-container') | first }}"
  ansible.builtin.command:
    cmd: "lxc-attach -n {{ keystone_ct }} -- systemctl restart {{ item }}"
  loop:
    - "apache2"
    - "uwsgi"
    - "keystone-wsgi-public"
  failed_when: false
  changed_when: true

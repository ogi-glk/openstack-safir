[metadata]
name = safir_monitoring
summary = Safir Cloud Service Base - Fast API
description-file =
    README.rst
author = B3LAB
author-email = b3lab@tubitak.gov.tr
home-page = http://www.b3lab.org
classifier =
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.5
    Programming Language :: Python :: 3.7

[files]
packages =
    safir_monitoring
data_files =
    safir_monitoring/reporting/templates = safir_monitoring/reporting/templates/*
    safir_monitoring/templates = safir_monitoring/templates/*
    safir_monitoring/common = safir_monitoring/common/metric.json

[entry_points]
oslo.policy.policies =
    safir_monitoring = safir_monitoring.common.policies:list_rules

oslo.policy.enforcer =
    safir_monitoring = safir_monitoring.common.policy:get_enforcer

[build_sphinx]
all_files = 1
build-dir = doc/build
source-dir = doc/source

[global]
setup-hooks =
    pbr.hooks.setup_hook
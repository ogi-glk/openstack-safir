# This is an example Apache2 configuration file for using the
# safir_cloud_watcher API through mod_wsgi.

# Note: If you are using a Redhat-based system then the paths
# "/var/log/apache2" and "/var/run/apache2" will use "httpd" instead
# of "apache2".
#
# The number of processes and threads is an example only and should
# be adjusted according to local requirements.

Listen 8839

<VirtualHost *:8839>
    WSGIDaemonProcess safircloudwatcher-api processes=2 threads=10 user=safir_cloud_watcher display-name=%{GROUP}
    WSGIProcessGroup safircloudwatcher-api
    WSGIScriptAlias / /var/www/safir_cloud_watcher/app.wsgi
    WSGIApplicationGroup %{GLOBAL}
    <IfVersion >= 2.4>
        ErrorLogFormat "%{cu}t %M"
    </IfVersion>
    ErrorLog /var/log/apache2/safir_cloud_watcher_error.log
    CustomLog /var/log/apache2/safir_cloud_watcher_access.log combined
</VirtualHost>

WSGISocketPrefix /var/run/apache2

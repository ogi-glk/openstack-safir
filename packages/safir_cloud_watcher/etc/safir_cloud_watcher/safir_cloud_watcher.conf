[DEFAULT]

#
# Name of this node (string value)
#
# host = <hostname>

#
# Configuration file for WSGI definition of API (string value)
#
# api_paste_config = api_paste.ini

#
# Authentication strategy: keystone or noauth (string value)
# Allowed values: keystone, noauth
#
# auth_strategy = keystone

[api]

#
# Host serving the API (IP value)
#
# host_ip = 0.0.0.0

#
# Host port serving the API (port value)
#
# port = 8839

#
# Toggle Pecan Debug Middleware (boolean value)
#
# pecan_debug = false

[keystone_authtoken]

#
# Keystone authentication configuration
# See keystonemiddleware documentation for full options
#
# auth_type = password
# auth_url = http://controller:5000
# www_authenticate_uri = http://controller:5000
# project_domain_id = default
# user_domain_id = default
# project_name = service
# username = safir_cloud_watcher
# password = <password>
# region_name = RegionOne

[openstack_auth]

#
# OpenStack authentication for service-to-service communication
# Used by BaseConnector for Nova, Keystone etc. API calls
#
# auth_type = password
# auth_url = http://controller:5000/v3
# project_domain_id = default
# user_domain_id = default
# project_name = service
# username = safir_cloud_watcher
# password = <password>

[database]

#
# Database connection URL (string value)
#
# connection = mysql+pymysql://safir_cloud_watcher:<password>@controller:3306/safir_cloud_watcher?charset=utf8

[oslo_messaging_notifications]

#
# Notification driver (string value)
#
# driver = messagingv2

#
# Notification topics (list value)
#
# topics = notifications

#
# Notification transport URL (string value)
#
# transport_url = rabbit://user:pass@host:5672/vhost

[notification]

#
# Acknowledge message when event persistence fails (boolean value)
#
# ack_on_event_error = true

#
# Messaging URLs to listen for notifications.
# Example: rabbit://user:pass@host1:port1[,user:pass@hostN:portN]/virtual_host
# Multiple URLs can be specified for different services/vhosts.
# (multi-valued string)
#
# messaging_urls = rabbit://nova:pass@host:5672/nova?ssl=0
# messaging_urls = rabbit://cinder:pass@host:5672/cinder?ssl=0
# messaging_urls = rabbit://neutron:pass@host:5672/neutron?ssl=0
# messaging_urls = rabbit://keystone:pass@host:5672/keystone?ssl=0
# messaging_urls = rabbit://glance:pass@host:5672/glance?ssl=0
# messaging_urls = rabbit://heat:pass@host:5672/heat?ssl=0
# messaging_urls = rabbit://octavia:pass@host:5672/octavia?ssl=0
# messaging_urls = rabbit://skyline:pass@host:5672/skyline?ssl=0

#
# Filter events for recording. Use event_name for inclusion,
# !event_name for exclusion. (list value)
# Example: compute.*,storage.*,!disk.*
#
# supported_events = *

#
# Number of notification messages to wait before publishing (integer value)
# Minimum value: 1
#
# batch_size = 1

#
# Number of seconds to wait before dispatching samples when
# batch_size is not reached. None means indefinitely. (integer value)
#
# batch_timeout = <None>

#
# Number of workers for notification service (integer value)
# Minimum value: 1
#
# workers = 1

#
# Configuration file for event definitions (string value)
#
# definitions_cfg_file = event_definitions.yaml

#
# Drop notifications if no event definition matches (boolean value)
#
# drop_unmatched_notifications = false

#
# Store the raw notification for select priority levels (multi-valued string)
# Values: info, error
#
# store_raw =

#
# Maximum number of parallel requests for services to handle (integer value)
# Minimum value: 1
#
# max_parallel_requests = 64

#
# List of service user names to exclude from identity.authenticate events.
# Only real user logins will be recorded. Supports glob patterns.
# Example: nova,cinder,oltu-sa-*
# (list value)
#
# service_users = nova,cinder,neutron,glance,heat,octavia,manila,magnum,masakari,zun,watcher,barbican,placement,swift

[opensearch]

#
# OpenSearch Host URL (string value)
#
# host =

#
# OpenSearch Port (string value)
#
# port = 9200

#
# OpenSearch username (string value)
#
# username = admin

#
# OpenSearch password (string value)
#
# password =

#
# Enable gzip compression for request bodies (boolean value)
#
# http_compress = false

#
# Use SSL for OpenSearch connection (boolean value)
#
# use_ssl = false

#
# Verify SSL certificates (boolean value)
#
# verify_certs = false

#
# Assert hostname in SSL certificate (boolean value)
#
# ssl_assert_hostname = false

#
# Show SSL warnings (boolean value)
#
# ssl_show_warn = false

#
# Path to CA certificates file (string value)
#
# ca_certs_path =

#
# OpenSearch index name for standard events (string value)
#
# index_name = events

#
# OpenSearch index name for audit events used for enrichment (string value)
#
# audit_index_name = audit_events

[syslog_forward]

#
# Enable forwarding events to a remote syslog server (boolean value)
# When enabled, every event written to the events index is also sent
# to the configured syslog server. Disabled by default.
#
# enabled = false

#
# Remote syslog server host/IP (string value)
#
# host =

#
# Remote syslog server port (integer value)
#
# port = 514

#
# Syslog protocol: udp or tcp (string value)
#
# protocol = udp

#
# Syslog facility (string value)
# Allowed values: local0, local1, local2, local3, local4, local5, local6, local7
#
# facility = local0

[metadata]
name = safir_cloud_watcher
summary = Safir Cloud Watcher for OpenStack
description_file =
    README.rst
author = B3LAB
author_email = b3lab@tubitak.gov.tr
home_page = http://www.b3lab.org
classifier =
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 2
    Programming Language :: Python :: 2.7
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.4
    Programming Language :: Python :: 3.7

[files]
packages =
    safir_cloud_watcher

[entry_points]
console_scripts =
    safircloudwatcher-dbsync = safir_cloud_watcher.cli.dbsync:main
    safircloudwatcher-processor = safir_cloud_watcher.cli.processor:main
    safircloudwatcher-event-manager = safir_cloud_watcher.cli.event_manager:main

wsgi_scripts =
    safircloudwatcher-api = safir_cloud_watcher.api.app:build_wsgi_app

oslo.policy.enforcer =
    safir_cloud_watcher = safir_cloud_watcher.common.policy:get_enforcer

oslo.policy.policies =
    safir_cloud_watcher = safir_cloud_watcher.common.policies:list_rules

oslo.config.opts =
    safir_cloud_watcher.common.config = safir_cloud_watcher.common.config:list_opts

oslo.config.opts.defaults =
    safir_cloud_watcher.common.config = safir_cloud_watcher.common.defaults:set_cors_middleware_defaults

safir_cloud_watcher.event.helpers.trait_plugin =
    split = safir_cloud_watcher.event.helpers.trait_plugins:SplitterTraitPlugin
    bitfield = safir_cloud_watcher.event.helpers.trait_plugins:BitfieldTraitPlugin
    timedelta = safir_cloud_watcher.event.helpers.trait_plugins:TimedeltaPlugin

[build_sphinx]
all_files = 1
build-dir = doc/build
source-dir = doc/source

[global]
setup-hooks =
    pbr.hooks.setup_hook
